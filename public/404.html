<!DOCTYPE html>
<html lang="en">
<head>

<title>Not Found: Vibe RP</title>
<link rel="icon" href="/icon.svg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0B0C10;
    color: #F3F4F6;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 32rem; width: 100%; text-align: center; }
  .mark {
    width: 64px;
    height: 64px;
    margin: 0 auto 1.75rem;
    display: block;
    border-radius: 14px;
  }
  .code {
    font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 0.8125rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #D8B273;
    margin: 0 0 0.75rem;
  }
  h1 {
    font-size: clamp(1.5rem, 4vw, 2rem);
    line-height: 1.2;
    margin: 0 0 0.75rem;
    font-weight: 600;
  }
  p {
    color: #9CA3AF;
    line-height: 1.6;
    margin: 0 0 2rem;
  }
  a.return {
    display: inline-block;
    padding: 0.7rem 1.4rem;
    border: 1px solid rgba(216, 178, 115, 0.45);
    border-radius: 10px;
    color: #D8B273;
    text-decoration: none;
    font-weight: 500;
    transition: background-color 120ms ease, border-color 120ms ease;
  }
  a.return:hover, a.return:focus-visible {
    background: rgba(216, 178, 115, 0.12);
    border-color: #D8B273;
  }
  a.return:focus-visible { outline: 2px solid #D8B273; outline-offset: 2px; }

<body>
<main>
  <img class="mark" src="/icon.svg" alt="" width="64" height="64" aria-hidden="true">
  <p class="code">404</p>

</main>
</body>
</html>
